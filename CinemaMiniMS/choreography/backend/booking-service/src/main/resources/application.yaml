# Load this service's .env when launched from IntelliJ, Maven or java -jar.
# Environment variables and command-line arguments can still override file values.
# Each service writes its own file when launched directly from IntelliJ.
# Relative to the Run Configuration working directory (repository root recommended).
logging:
  file:
    name: logs/choreography/booking.log
  # Hiện file Java và số dòng trên cả IntelliJ lẫn file log.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{60} [%file:%line] : %msg%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{60} [%file:%line] : %msg%n%wEx"
server:
  address: ${SERVICE_BIND_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        name: CINEMA_CHOREO_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 30m
  error:
    include-message: never
    include-stacktrace: never
spring:
  config:
    # Nạp .env riêng của booking-service theo working directory, không đọc rabbitmq/.env của Docker.
    # Biến môi trường/command line có thể ghi đè; cú pháp ${TEN_BIEN:mac_dinh} dùng giá trị sau dấu : khi thiếu biến.
    import:
      - "optional:file:./choreography/backend/booking-service/.env[.properties]"
      - "optional:file:./backend/booking-service/.env[.properties]"
      - "optional:file:./booking-service/.env[.properties]"
      - "optional:file:./.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: cinema-choreo-booking
  rabbitmq:
    # Java chạy từ IntelliJ trên Windows nối vào cổng Docker đã publish ở 127.0.0.1.
    # Nếu sau này Java chạy trong container, phải dùng địa chỉ broker truy cập được từ container đó.
    host: ${RABBITMQ_HOST:127.0.0.1}
    # 5672 là cổng AMQP cho code gửi/nhận; 15672 chỉ dành cho trang quản lý và HTTP API.
    port: ${RABBITMQ_PORT:5672}
    # Vhost là không gian chứa exchange/queue; cả ba service dùng cinema để trao đổi cùng sự kiện.
    virtual-host: ${RABBITMQ_VHOST:cinema}
    # User/password/vhost phải khớp broker và user cần quyền thao tác trong vhost này.
    username: ${RABBITMQ_USERNAME:cinema_mq}
    # Lấy từ .env riêng hoặc môi trường; service không tự lấy mật khẩu từ Compose của RabbitMQ.
    password: ${RABBITMQ_PASSWORD}
    # Gắn broker confirm với CorrelationData của từng lần gửi trong EventPublisher.
    # Confirm chỉ xác nhận broker tiếp nhận; chưa chứng minh service nhận đã xử lý nghiệp vụ xong.
    publisher-confirm-type: correlated
    # Nhận thông tin message bị trả lại nếu exchange không định tuyến được vào queue nào.
    publisher-returns: true
    template:
      # Kết hợp publisher-returns để publisher phát hiện message không có queue nhận.
      mandatory: true
      retry:
        # Không tự gửi lại khi publish lỗi; EventPublisher ghi log lỗi sau DB commit để kiểm tra.
        enabled: false
    listener:
      simple:
        # Một instance service tạo một consumer cho @RabbitListener hiện tại, không tự tăng song song.
        concurrency: 1
        max-concurrency: 1
        # Mỗi consumer chỉ giữ tối đa một message chưa ACK, thuận tiện quan sát khi debug.
        prefetch: 1
        # ACK mặc định AUTO của Spring: ACK khi handler hoàn tất thành công, không ngay lúc giao message.
        # Ready = chờ giao; Unacked = đã giao nhưng broker chưa nhận ACK, không đồng nghĩa SQL chưa commit.
        # Lỗi bị từ chối không requeue: topology trong RabbitConfiguration đưa message sang queue .dead.
        default-requeue-rejected: false
        retry:
          # Không retry handler tại chỗ; .dead không có consumer tự xử lý lại trong phiên bản này.
          enabled: false
  datasource:
    url: ${DB_URL}
    username: cinema_booking
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      connection-init-sql: SET TIME ZONE 'Asia/Ho_Chi_Minh'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: booking
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  mvc:
    async:
      request-timeout: 1200000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
cinema:
  schema: booking
  internal-key: ${INTERNAL_API_KEY}
  account-url: ${ACCOUNT_SERVICE_URL}
  seat-url: ${SEAT_SERVICE_URL}
  payment-url: ${PAYMENT_SERVICE_URL}
  frontend-origins: ${FRONTEND_ORIGINS}
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:10000}
    stream-read-timeout-ms: ${STREAM_READ_TIMEOUT_MS:30000}
---
# Explicit opt-in for several independent processes on one development machine.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:50100/cinema_choreography}
server:
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
cinema:
  account-url: ${ACCOUNT_SERVICE_URL:http://127.0.0.1:9091}
  seat-url: ${SEAT_SERVICE_URL:http://127.0.0.1:9092}
  payment-url: ${PAYMENT_SERVICE_URL:http://127.0.0.1:9093}
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
