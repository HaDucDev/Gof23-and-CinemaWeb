spring:
  application:
    name: CinemaMini
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:50099/cinemamini}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:CinemaMiniDb123}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  liquibase:
    enabled: false
  thymeleaf:
    cache: false
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
